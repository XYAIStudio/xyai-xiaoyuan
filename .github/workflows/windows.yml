name: Windows installers

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc

      - name: Install JS deps
        run: npm ci

      - name: Build NSIS
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXTRA=()
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY secret; building unsigned NSIS (no updater artifacts)."
            EXTRA+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          # NSIS only: WiX light.exe fails on this runner with a Chinese MSI filename.
          # Windows packages use ASCII productName from tauri.windows.conf.json.
          npx tauri build --bundles nsis "${EXTRA[@]}"
          echo "NSIS output:"
          ls -la src-tauri/target/release/bundle/nsis || true

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: xyai-xiaoyuan-windows-x64-nsis
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*
