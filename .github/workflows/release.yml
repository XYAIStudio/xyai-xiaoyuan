name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional git tag (defaults to app-v plus tauri.conf version)"
        required: false
  push:
    tags:
      - "v*"
      - "app-v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
          - platform: macos-latest
            args: --bundles app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install Tauri Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: npm ci

      - name: Optional Authenticode certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No WINDOWS_CERTIFICATE secret; skipping Authenticode (unsigned NSIS is OK)."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "xyai-xiaoyuan-codesign.pfx"
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $password = $env:WINDOWS_CERTIFICATE_PASSWORD
          if ([string]::IsNullOrWhiteSpace($password)) {
            Write-Host "WINDOWS_CERTIFICATE set but password empty; skip Authenticode."
            exit 0
          }
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Imported Authenticode cert $($cert.Thumbprint)"

      - name: Updater signing availability
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          CONFIG_JSON="$(python3 scripts/tauri-ci-config.py || python scripts/tauri-ci-config.py)"
          extra=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY; unsigned build, no latest.json updater artifacts."
          fi
          if [ -n "${CONFIG_JSON}" ]; then
            extra="--config ${CONFIG_JSON}"
          fi
          echo "extra=${extra}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "XYAI精灵小元 v__VERSION__"
          releaseBody: "官方桌面伴侣安装包。Windows 请下载 NSIS setup.exe。更新清单 latest.json 与 NSIS 产物在同一 Release。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.extra }}
          updaterJsonPreferNsis: true
